<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Holographic Shield Gradient -->
    <linearGradient id="docshield-shield-grad" x1="18" y1="10" x2="102" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- High-Impact Vibrant Checkmark Gradient -->
    <linearGradient id="docshield-check-grad" x1="10" y1="20" x2="115" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="25%" stop-color="#2DD4BF" />
      <stop offset="70%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Document Lines Gradient -->
    <linearGradient id="docshield-doc-lines" x1="35" y1="24" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.75" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="docshield-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Popout 3D Effect -->
    <filter id="docshield-check-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#041E1A" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="60" cy="60" r="46" fill="url(#docshield-shield-grad)" opacity="0.12" filter="url(#docshield-glow)" />

  <!-- Outer Shield Frame (Cyber-Sentinel Curvature) -->
  <path
    d="M60 10 L98 25 C98 68 81 99 60 110 C39 99 22 68 22 25 L60 10 Z"
    fill="#041E1A"
    fill-opacity="0.4"
    stroke="url(#docshield-shield-grad)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Document Body (Top-Right Folded Security Credential) -->
  <path
    d="M38 30 H67 L79 42 V68 C79 68 70 68 60 68 C48 68 38 66 38 66 V30 Z"
    fill="#0B2B26"
    fill-opacity="0.4"
    stroke="url(#docshield-doc-lines)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Folded Corner -->
  <path
    d="M67 30 V42 H79"
    fill="none"
    stroke="url(#docshield-doc-lines)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Document Micro-Data Lines -->
  <line x1="45" y1="40" x2="61" y2="40" stroke="url(#docshield-doc-lines)" stroke-width="3.2" stroke-linecap="round" />
  <line x1="45" y1="48" x2="69" y2="48" stroke="url(#docshield-doc-lines)" stroke-width="3.2" stroke-linecap="round" />
  <line x1="45" y1="56" x2="59" y2="56" stroke="url(#docshield-doc-lines)" stroke-width="3.2" stroke-linecap="round" />

  <!-- Verified Checkmark (Prominent, High-Contrast & Powerful) -->
  <path
    d="M13 55 L45 88 L108 19"
    fill="none"
    stroke="url(#docshield-check-grad)"
    stroke-width="13.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#docshield-check-shadow)"
  />

  <!-- Inner Checkmark Specular Core Highlight -->
  <path
    d="M16 55 L45 84 L105 19"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
</svg>
